<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Intro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    overflow: hidden;
  }

  video {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Pendant la vidéo, aucun bouton d'écran d'accueil ne doit être affiché. */
  #seb-evalpro-privacy-toggle {
    display: none !important;
  }

  /* Effet de fondu */
  #fade {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: black;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    pointer-events: none;
  }
</style>
</head>

<body>
<video id="introVideo" autoplay muted playsinline>
  <source src="imageqcm/video_brique.mp4" type="video/mp4">
</video>

<div id="fade"></div>

<script src="js/introbrique-page.js"></script>

</body>
</html>
