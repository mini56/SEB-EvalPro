name: TEST Admin 0.3.9 Only

on:
  push:
    branches:
      - tmp-windows-setup-039-final-audit

permissions:
  contents: write

jobs:
  admin-only:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate clean web application
        run: npm run prepare:web

      - name: Admin functional smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron --no-sandbox scripts/admin-bilan-windows-smoke.js
          if ($LASTEXITCODE -ne 0) { throw 'Smoke Admin Electron échoué.' }
          Write-Host 'ADMIN_FUNCTIONAL_SMOKE_WINDOWS: OK'

      - name: Ensure ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress -y
          }
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            throw 'ImageMagick introuvable.'
          }

      - name: Generate installer branding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/generate-installer-branding.ps1

      - name: Build native candidate keyboard guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $compile = 'call "' + $vcvars + '" && cl.exe /nologo /O2 /EHsc /DUNICODE /D_UNICODE native\candidate-keyguard.cpp /Fe:build\candidate-keyguard.exe user32.lib'
          cmd.exe /d /c $compile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'build\candidate-keyguard.exe')) { throw 'Compilation candidate-keyguard.exe échouée.' }

      - name: Normalize NSIS encoding
        shell: pwsh
        run: |
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          $path = (Resolve-Path 'build\installer.nsh').Path
          $text = [System.IO.File]::ReadAllText($path)
          [System.IO.File]::WriteAllText($path, $text, $utf8Bom)

      - name: Build Windows Setup 0.3.9
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Construction Windows échouée.' }
          if (-not (Test-Path 'dist\SEB-eval-PRO-0.3.9-Windows-Setup.exe')) { throw 'Setup 0.3.9 absent.' }
          Write-Host "SETUP_SHA256=$((Get-FileHash 'dist\SEB-eval-PRO-0.3.9-Windows-Setup.exe' -Algorithm SHA256).Hash)"

      - name: Real Admin edition install and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'dist\SEB-eval-PRO-0.3.9-Windows-Setup.exe').Path
          $installDir = 'C:\SEBEvalPro-Admin-039-CI'
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          New-Item -Path 'HKCU:\Software\SEB EvalPro' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\SEB EvalPro' -Name Edition -Value 'admin'

          $p = Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation Admin échouée : $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'edition-admin.flag'))) { throw 'edition-admin.flag absent.' }
          if (Test-Path (Join-Path $installDir 'edition-candidate.flag')) { throw 'edition-candidate.flag présent sur édition Admin.' }

          $edition = Get-Content (Join-Path $installDir 'edition.json') -Raw | ConvertFrom-Json
          if ($edition.edition -ne 'admin') { throw "edition.json Admin invalide : $($edition.edition)" }

          $exe = Join-Path $installDir 'SEB-éval-PRO.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $installDir -Filter '*.exe' | Where-Object { $_.Name -notmatch '^Uninstall' } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw 'Exécutable Admin introuvable.' }

          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()
            if ($process.HasExited) { throw 'Édition Admin arrêtée au démarrage.' }
            if ($process.MainWindowHandle -eq 0) { throw 'Aucune fenêtre Admin visible.' }
            if ([string]$process.MainWindowTitle -match 'Démarrage impossible') { throw 'Écran de blocage sécurité en édition Admin.' }
            Write-Host "ADMIN_INSTALLED_WINDOW_OK=$($process.MainWindowTitle)"
          }
          finally {
            if ($process -and -not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null }
          }
          Write-Host 'REAL_ADMIN_EDITION_INSTALL_LAUNCH: OK'

      - name: Upload Admin-validated Setup
        uses: actions/upload-artifact@v4
        with:
          name: SEB-eval-PRO-0.3.9-Admin-validated
          path: dist/SEB-eval-PRO-0.3.9-Windows-Setup.exe
          if-no-files-found: error
