name: Test candidate replay prototype

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-candidate-replay-test

env:
  SEB_BUILD_LABEL: 134-REPLAY-BILAN-TEST2

jobs:
  build-windows-replay-test:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax check prototype modules
        run: |
          node --check src/replay-main.js
          node --check src/replay-preload.js
          node --check src/replay-navigation-capture.js
          node --check src/bilan-history-main.js
          node --check src/bilan-history-preload.js
          node --check scripts/candidate-replay-prototype.js
          node --check scripts/replay-page3-paronymes-fix.js
      - name: Ensure ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress -y
          }
      - name: Generate installer branding
        shell: pwsh
        run: |
          $env:GITHUB_RUN_NUMBER = $env:SEB_BUILD_LABEL
          ./scripts/generate-installer-branding.ps1
      - name: Normalize Windows NSIS encodings
        shell: pwsh
        run: |
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          foreach ($relativePath in @('build\installer.nsh','build\standalone-uninstaller.nsi')) {
            $path = (Resolve-Path $relativePath).Path
            $text = [System.IO.File]::ReadAllText($path)
            [System.IO.File]::WriteAllText($path, $text, $utf8Bom)
          }
      - name: Build Windows prototype
        run: npm run dist:win
      - name: Verify replay page3, Paronymes and bilan history wiring
        shell: pwsh
        run: |
          $preload = Get-Content 'src\preload.js' -Raw
          $main = Get-Content 'src\main.js' -Raw
          $replayMain = Get-Content 'src\replay-main.js' -Raw
          $replayPreload = Get-Content 'src\replay-preload.js' -Raw
          $navCapture = Get-Content 'src\replay-navigation-capture.js' -Raw
          $bilanMain = Get-Content 'src\bilan-history-main.js' -Raw
          $bilanPreload = Get-Content 'src\bilan-history-preload.js' -Raw
          $paronymes = Get-Content 'app\web\paronymes.html' -Raw
          if (-not $preload.Contains('replayPrototype.install();')) { throw 'Replay UI non branchée' }
          if (-not $preload.Contains('replayNavigationCapture.install();')) { throw 'Capture navigation replay non branchée' }
          if (-not $preload.Contains('bilanHistory.install();')) { throw 'Historique bilan UI non branché' }
          if (-not $main.Contains("require('./bilan-history-main')")) { throw 'Backend historique bilan non branché' }
          if (-not $main.Contains('buildNumber: "134-REPLAY-BILAN-TEST2"')) { throw 'Build test non figé dans les archives' }
          if (-not $replayMain.Contains("archiveMode: 'VISUAL_FROZEN_SLIDES'")) { throw 'Archive visuelle autonome absente' }
          if (-not $replayPreload.Contains('SEB_REPLAY_NAV_CAPTURE_GUARD')) { throw 'Garde capture/navigation absente' }
          if (-not $navCapture.Contains("captureNow('navigation-before-guaranteed')")) { throw 'Capture garantie page avant navigation absente' }
          if (-not $paronymes.Contains('data-correct="true">Boisé</td>')) { throw 'Paronymes Arboré -> Boisé incorrect' }
          if (-not $paronymes.Contains('Array.from(corrects).includes(selected)')) { throw 'Score Paronymes non durci' }
          if (-not $paronymes.Contains('paronymes_erreurs_detail')) { throw 'Diagnostic ligne fautive Paronymes absent' }
          if (-not $bilanMain.Contains("ipcMain.handle('bilan-history:save-current'")) { throw 'Sauvegarde historique bilan absente' }
          if (-not $bilanMain.Contains("ipcMain.handle('bilan-history:save-revision'")) { throw 'Révisions bilan absentes' }
          if (-not $bilanPreload.Contains('Ouvrir un ancien bilan')) { throw 'Bouton ancien bilan absent' }
          Write-Host 'Replay page3 garanti + Paronymes Boisé vérifié + historique bilan: OK'
      - name: Publish corrected test installer to private GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'seb-evalpro-replay-bilan-test2-134'
          $setup = 'dist\SEB-eval-PRO-0.1.0-Windows-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Setup Windows test absent' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $notes = "Prototype isolé basé strictement sur le Build #134 validé.`n`nCorrection Replay : la page en cours est désormais capturée et la capture terminée AVANT toute navigation. Cela corrige le cas observé où la page 3 apparaissait vide dans le replay.`n`nParonymes : vérification bloquante de la ligne Arboré -> Boisé, reconnaissance durcie des cellules data-correct=true et enregistrement du détail exact des éventuelles lignes fausses dans la session pour diagnostic.`n`nLe replay visuel et l'historique des bilans éditables par révisions restent inclus.`n`nSHA256 Setup : $hash"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber --repo "${{ github.repository }}"
            gh release edit $tag --title 'SEB EvalPro Build #134 - REPLAY/BILAN TEST2' --notes $notes --prerelease --repo "${{ github.repository }}"
          } else {
            gh release create $tag $setup --target "${{ github.sha }}" --title 'SEB EvalPro Build #134 - REPLAY/BILAN TEST2' --notes $notes --prerelease --repo "${{ github.repository }}"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publication de la Release test échouée' }
          Write-Host "Test publié : $tag"
          Write-Host "SHA256 : $hash"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SEB-EvalPro-134-REPLAY-BILAN-TEST2-Windows
          path: dist/SEB-eval-PRO-0.1.0-Windows-Setup.exe

  build-linux-replay-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax check prototype modules
        run: |
          node --check src/replay-main.js
          node --check src/replay-preload.js
          node --check src/replay-navigation-capture.js
          node --check src/bilan-history-main.js
          node --check src/bilan-history-preload.js
          node --check scripts/candidate-replay-prototype.js
          node --check scripts/replay-page3-paronymes-fix.js
      - name: Build Linux prototype
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SEB-EvalPro-134-REPLAY-BILAN-TEST2-Linux
          path: dist/*.AppImage
