name: Retry Release SEB EvalPro 0.3.6

on:
  push:
    branches:
      - tmp-seb-ia-v1
    paths:
      - '.github/workflows/retry-release-036.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated 0.3.6 Setup artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh run download 36041790049             --repo "${{ github.repository }}"             --name "SEB-EvalPro-0.3.6-Windows-Setup"             --dir release-files

      - name: Verify validated Setup SHA256
        shell: bash
        run: |
          set -euo pipefail
          setup="release-files/SEB-eval-PRO-0.3.6-Windows-Setup.exe"
          test -f "$setup"
          expected="9F0EE6D7422796782478AD26879D0619BB9224200E487123CD0161E2C9DD3D29"
          actual="$(sha256sum "$setup" | awk '{print toupper($1)}')"
          echo "SETUP_SHA256=$actual"
          test "$actual" = "$expected"

      - name: Create GitHub Release 0.3.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="seb-evalpro-seb-ia-036-build-44"
          setup="release-files/SEB-eval-PRO-0.3.6-Windows-Setup.exe"
          title="SEB EvalPro 0.3.6 - SEB-IA - Build #44"
          notes="SEB EvalPro 0.3.6 validée sur le run Windows 36041790049.

Setup : SEB-eval-PRO-0.3.6-Windows-Setup.exe
SHA256 : 9F0EE6D7422796782478AD26879D0619BB9224200E487123CD0161E2C9DD3D29

Cette version intègre SEB-IA locale, la protection des données candidat, la récupération de la clé et de l'état de reprise, ainsi que les contrôles d'export/import chiffrés validés sur le run de référence."

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$setup" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$setup"               --target "f982f3b2eb820222e200a1e2f8edb97065dbb6f0"               --title "$title"               --notes "$notes"               --prerelease               --repo "${{ github.repository }}"
          fi

      - name: Confirm Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "seb-evalpro-seb-ia-036-build-44"             --repo "${{ github.repository }}"             --json url,tagName,name,isPrerelease
