name: TEST Windows SEB-IA Full Setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.3.8') { throw "Version attendue 0.3.8, trouvée : $version" }
          Write-Host "SEB_VERSION: $version"

      - name: Validate SEB-IA
        run: npm run test:seb-ia

      - name: Test candidate data security
        run: npm run test:security

      - name: Test direct USB drive root export and import
        shell: pwsh
        run: |
          $usbDir = Join-Path $env:RUNNER_TEMP 'seb-usb-root-drive'
          New-Item -ItemType Directory -Force -Path $usbDir | Out-Null
          subst R: $usbDir
          try {
            $env:SEB_USB_ROOT = 'R:\'
            node scripts/candidate-windows-drive-root-smoke.js
          }
          finally {
            subst R: /D
          }

      - name: Generate web application and verify preserved parcours names
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run prepare:web
          if ($LASTEXITCODE -ne 0) { throw 'prepare:web a échoué.' }

          $checks = @(
            @{ File='app\\web\\planning.html'; Value='Katell' },
            @{ File='app\\web\\planning.html'; Value='Lizig' },
            @{ File='app\\web\\planning.html'; Value='Jean le livreur' },
            @{ File='app\\web\\planning.html'; Value='Jacqueline la comptable' },
            @{ File='app\\web\\nvmail.html'; Value='CV_Julie.pdf' }
          )
          foreach ($check in $checks) {
            if (-not (Test-Path $check.File)) { throw "Page générée absente : $($check.File)" }
            $content = Get-Content $check.File -Raw -Encoding UTF8
            if (-not $content.Contains($check.Value)) {
              throw "Nom du parcours perdu : $($check.Value) dans $($check.File)"
            }
          }
          Write-Host 'PARCOURS_NAMES_PRESERVED: Katell, Lizig, Jean, Jacqueline, Julie — OK'

      - name: Ensure ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress -y
          }
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            throw 'ImageMagick introuvable.'
          }

      - name: Generate official Sauvegarde 56 installer branding and icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/generate-installer-branding.ps1
          foreach ($path in @('build/app-icon.ico','build/installerHeader.bmp','build/installerBranding.bmp')) {
            if (-not (Test-Path $path)) { throw "Ressource installateur absente : $path" }
          }
          $brandingGeometry = (& magick identify -format '%wx%h' 'build/installerBranding.bmp').Trim()
          $headerGeometry = (& magick identify -format '%wx%h' 'build/installerHeader.bmp').Trim()
          if ($brandingGeometry -ne '450x228') { throw "Branding invalide : $brandingGeometry" }
          if ($headerGeometry -ne '150x57') { throw "Bandeau invalide : $headerGeometry" }
          $icoInfo = (& magick identify -format "%wx%h`n" 'build/app-icon.ico') -join "`n"
          foreach ($size in @(16,20,24,32,40,48,64,96,128,256)) {
            if ($icoInfo -notmatch "(?m)^$($size)x$($size)$") {
              throw "Trame icône officielle absente : $($size)x$($size)"
            }
          }
          Write-Host 'ICON_OFFICIELLE_MULTI_RESOLUTION: OK'
          Write-Host 'INSTALLATEUR_SAUVEGARDE56: OK'

      - name: Build native candidate keyboard guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe introuvable.' }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual C++ Build Tools introuvables.' }
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $compile = 'call "' + $vcvars + '" && cl.exe /nologo /O2 /EHsc /DUNICODE /D_UNICODE native\candidate-keyguard.cpp /Fe:build\candidate-keyguard.exe user32.lib'
          cmd.exe /d /c $compile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'build\candidate-keyguard.exe')) {
            throw 'Compilation candidate-keyguard.exe échouée.'
          }
          Write-Host 'CANDIDATE_KEYGUARD: OK'

      - name: Normalize Windows NSIS encodings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          foreach ($relativePath in @('build\installer.nsh','build\standalone-uninstaller.nsi')) {
            $path = (Resolve-Path $relativePath).Path
            $text = [System.IO.File]::ReadAllText($path)
            [System.IO.File]::WriteAllText($path, $text, $utf8Bom)
          }

      - name: Build Windows Setup 0.3.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Construction Windows échouée.' }
          $setup = 'dist\SEB-eval-PRO-0.3.8-Windows-Setup.exe'
          if (-not (Test-Path $setup)) { throw "Setup 0.3.8 absent : $setup" }
          if (Test-Path 'dist\win-unpacked\resources\ai') {
            throw 'Un ancien Pack IA externe est encore embarqué.'
          }
          if (-not (Test-Path 'dist\win-unpacked\resources\candidate-keyguard.exe')) {
            throw 'candidate-keyguard.exe absent du programme empaqueté.'
          }
          Write-Host "SETUP_038: $((Resolve-Path $setup).Path)"

      - name: Build standalone Windows uninstaller 0.3.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis --no-progress -y
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
            if (Test-Path $candidate) { $makensis = Get-Item $candidate }
          }
          if (-not $makensis) { throw 'makensis.exe introuvable.' }
          $makensisPath = if ($makensis.Source) { $makensis.Source } else { $makensis.FullName }
          & $makensisPath '/DAPP_VERSION=0.3.8' 'build\standalone-uninstaller.nsi'
          if ($LASTEXITCODE -ne 0) { throw "Compilation désinstallateur échouée : $LASTEXITCODE" }
          $uninstaller = 'dist\SEB-eval-PRO-0.3.8-Windows-Desinstallation.exe'
          if (-not (Test-Path $uninstaller)) { throw "Désinstallateur absent : $uninstaller" }
          Write-Host 'STANDALONE_UNINSTALLER_038: OK'

      - name: Verify Setup identity and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'dist\SEB-eval-PRO-0.3.8-Windows-Setup.exe').Path
          $uninstaller = (Resolve-Path 'dist\SEB-eval-PRO-0.3.8-Windows-Desinstallation.exe').Path

          $installer = Get-Content 'build\installer.nsh' -Raw
          foreach ($required in @('Version Candidat','Version Administrateur','SEB-IA est intégrée','edition-candidate.flag','edition-admin.flag')) {
            if (-not $installer.Contains($required)) { throw "Fonction installateur absente : $required" }
          }
          if ($installer -match 'Ministral-3-8B-Instruct|SEB-EvalPro-IA-Pack-Setup|vc_redist\.x64\.exe') {
            throw 'Ancienne dépendance Mistral/Pack IA/VC++ encore présente dans le Setup.'
          }

          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash
          $uninstallHash = (Get-FileHash $uninstaller -Algorithm SHA256).Hash
          Write-Host "SETUP_SHA256=$setupHash"
          Write-Host "UNINSTALLER_SHA256=$uninstallHash"

      - name: Test real install shortcuts icon version and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing

          $setup = (Resolve-Path 'dist\SEB-eval-PRO-0.3.8-Windows-Setup.exe').Path
          $uninstaller = (Resolve-Path 'dist\SEB-eval-PRO-0.3.8-Windows-Desinstallation.exe').Path
          $installDir = 'C:\SEBEvalPro-038-CI'
          $documents = [Environment]::GetFolderPath('MyDocuments')
          $sebDocuments = Join-Path $documents 'SEB EvalPro'
          $upgradeRecovery = Join-Path $env:LOCALAPPDATA 'SEB EvalPro Recovery'
          $legacyAppData = Join-Path $env:APPDATA 'SEB-éval-PRO'

          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Remove-Item 'HKCU:\Software\SEB EvalPro' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $sebDocuments -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $upgradeRecovery -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $legacyAppData -ErrorAction SilentlyContinue

          # Simuler les fichiers durables d'une ancienne version avant mise à jour.
          New-Item -ItemType Directory -Force -Path $legacyAppData | Out-Null
          Set-Content -LiteralPath (Join-Path $legacyAppData 'candidate-local-key.sebkey') -Value 'CI-OLD-KEY-038' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $legacyAppData 'evaluation-state.json') -Value 'CI-OLD-STATE-038' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $legacyAppData 'active-candidate.json') -Value 'CI-OLD-POINTER-038' -Encoding ascii

          $p = Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation silencieuse échouée : $($p.ExitCode)" }

          foreach ($name in @('candidate-local-key.sebkey','evaluation-state.json','active-candidate.json')) {
            $backup = Join-Path $upgradeRecovery $name
            if (-not (Test-Path $backup)) { throw "Récupération pré-mise-à-jour absente : $backup" }
          }
          if ((Get-Content (Join-Path $upgradeRecovery 'candidate-local-key.sebkey') -Raw).Trim() -ne 'CI-OLD-KEY-038') {
            throw "La clé locale ancienne n'a pas été préservée hors de Documents."
          }
          if (Test-Path (Join-Path $sebDocuments 'System')) {
            throw "L'installeur 0.3.8 ne doit plus créer Documents\SEB EvalPro\System."
          }
          Write-Host 'PREUPDATE_RECOVERY_OUTSIDE_DOCUMENTS: OK'

          $exe = Join-Path $installDir 'SEB-éval-PRO.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $installDir -Filter '*.exe' | Where-Object { $_.Name -notmatch '^Uninstall' } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw "Exécutable SEB-éval-PRO installé introuvable." }

          if (-not (Test-Path (Join-Path $installDir 'resources\candidate-keyguard.exe'))) {
            throw "Garde clavier Candidat absent après installation."
          }
          if (-not (Test-Path (Join-Path $installDir 'edition-candidate.flag'))) {
            throw "Installation silencieuse par défaut non marquée Candidat."
          }

          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $productVersion -or -not $productVersion.StartsWith('0.3.8')) {
            throw "Version de l'exécutable incorrecte : $productVersion"
          }
          Write-Host "INSTALLED_VERSION=$productVersion"

          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if (-not $icon -or $icon.Width -lt 16 -or $icon.Height -lt 16) {
            throw "Icône Windows associée à SEB-éval-PRO invalide."
          }
          $icon.Dispose()
          Write-Host 'INSTALLED_PROGRAM_ICON: OK'

          $desktopCandidates = @(
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'SEB-éval-PRO.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'SEB-éval-PRO.lnk')
          ) | Select-Object -Unique
          $desktopLink = $desktopCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $desktopLink) { throw "Raccourci Bureau SEB-éval-PRO absent." }

          $startCandidates = @(
            (Join-Path ([Environment]::GetFolderPath('Programs')) 'SEB-éval-PRO.lnk'),
            (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'SEB-éval-PRO.lnk')
          ) | Select-Object -Unique
          $startLink = $startCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $startLink) { throw "Raccourci Menu Démarrer SEB-éval-PRO absent." }

          $ws = New-Object -ComObject WScript.Shell
          foreach ($link in @($desktopLink,$startLink)) {
            $sc = $ws.CreateShortcut($link)
            if (-not (Test-Path $sc.TargetPath)) { throw "Cible raccourci invalide : $link -> $($sc.TargetPath)" }
          }
          Write-Host 'DESKTOP_SHORTCUT: OK'
          Write-Host 'START_MENU_SHORTCUT: OK'

          $recoveryProbePaths = @(
            (Join-Path $env:APPDATA 'SEB-éval-PRO'),
            (Join-Path $env:LOCALAPPDATA 'SEB EvalPro Recovery')
          )
          foreach ($probePath in $recoveryProbePaths) {
            New-Item -ItemType Directory -Force -Path $probePath | Out-Null
            Set-Content -LiteralPath (Join-Path $probePath 'ci-recovery-probe.txt') -Value 'must survive uninstall' -Encoding ascii
          }

          $u = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Désinstallation autonome échouée : $($u.ExitCode)" }
          Start-Sleep -Seconds 2

          if (Test-Path $installDir) { throw "Dossier d'installation encore présent : $installDir" }
          foreach ($probePath in $recoveryProbePaths) {
            if (-not (Test-Path (Join-Path $probePath 'ci-recovery-probe.txt'))) {
              throw "Données de récupération supprimées à tort : $probePath"
            }
          }
          foreach ($link in @($desktopCandidates + $startCandidates)) {
            if (Test-Path $link) { throw "Raccourci encore présent après désinstallation : $link" }
          }

          Write-Host 'REAL_INSTALL_UNINSTALL: OK'
          Write-Host 'TECHNICAL_RECOVERY_OUTSIDE_DOCUMENTS: OK'

      - name: Test installed app migrates Documents and isolates corrupt data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'dist\SEB-eval-PRO-0.3.8-Windows-Setup.exe').Path
          $uninstaller = (Resolve-Path 'dist\SEB-eval-PRO-0.3.8-Windows-Desinstallation.exe').Path
          $documents = [Environment]::GetFolderPath('MyDocuments')
          $sebDocuments = Join-Path $documents 'SEB EvalPro'
          $upgradeRecovery = Join-Path $env:LOCALAPPDATA 'SEB EvalPro Recovery'
          $installDir = 'C:\SEBEvalPro-038-Startup-CI'

          $userDataCandidates = @(
            (Join-Path $env:APPDATA 'SEB-éval-PRO'),
            (Join-Path $env:APPDATA 'seb-evalpro'),
            (Join-Path $env:APPDATA 'SEB EvalPro'),
            (Join-Path $env:APPDATA 'SEB-eval-PRO')
          ) | Select-Object -Unique

          foreach ($candidate in $userDataCandidates) {
            Remove-Item -Recurse -Force $candidate -ErrorAction SilentlyContinue
          }
          Remove-Item -Recurse -Force $upgradeRecovery -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $sebDocuments -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue

          # Ancien stockage Documents volontairement encombré comme sur un vrai poste.
          $legacyCandidate = Join-Path $sebDocuments 'Candidats\CAND-LEGACY-CI'
          $legacySystem = Join-Path $sebDocuments 'System'
          $legacyBilan = Join-Path $sebDocuments 'Bilans'
          $legacyParcours = Join-Path $sebDocuments 'parcours'
          $legacyAdmin = Join-Path $sebDocuments 'Admin'
          $legacyCorbeille = Join-Path $sebDocuments 'Corbeille'
          foreach ($dir in @($legacyCandidate,$legacySystem,$legacyBilan,$legacyParcours,$legacyAdmin,$legacyCorbeille)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }
          Set-Content -LiteralPath (Join-Path $legacyCandidate 'manifest.json') -Value 'SEBLOCAL1:OLD-ENCRYPTED-CANDIDATE-CI' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $legacySystem 'candidate-local-key.sebkey') -Value 'OLD-UNREADABLE-KEY-CI' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $legacyParcours 'old.json') -Value '{"old":true}' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $legacyAdmin 'old.json') -Value '{"old":true}' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $legacyCorbeille 'old.json') -Value '{"old":true}' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $legacyBilan 'Evaluation_CI.docx') -Value 'WORD-CI' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $sebDocuments 'ancienne-trace.tmp') -Value 'legacy-root-file' -Encoding ascii

          $install = Start-Process -FilePath $setup -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installation de test démarrage échouée : $($install.ExitCode)" }

          $exe = Join-Path $installDir 'SEB-éval-PRO.exe'
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem $installDir -Filter '*.exe' | Where-Object { $_.Name -notmatch '^Uninstall' } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe -or -not (Test-Path $exe)) { throw 'Exécutable installé introuvable pour le test de démarrage.' }

          function Assert-SebWindow([string]$label) {
            $process = Start-Process -FilePath $exe -PassThru
            try {
              Start-Sleep -Seconds 6
              $process.Refresh()
              if ($process.HasExited) { throw "$label : SEB EvalPro s'est arrêté avant d'afficher sa fenêtre." }
              if ($process.MainWindowHandle -eq 0) { throw "$label : processus présent mais aucune fenêtre SEB EvalPro visible." }
              $title = [string]$process.MainWindowTitle
              if ($title -match 'Démarrage impossible') {
                throw "$label : l'écran de blocage sécurité a été affiché à la place du programme."
              }
              Write-Host "${label}: WINDOW_OK title='$title' handle=$($process.MainWindowHandle)"
            }
            finally {
              if ($process -and -not $process.HasExited) {
                & taskkill.exe /PID $process.Id /T /F | Out-Null
              }
              Start-Sleep -Milliseconds 900
            }
          }

          Assert-SebWindow 'REAL_APP_038_FIRST_START'

          # Documents\SEB EvalPro : seulement des Word, aucun sous-dossier.
          if (-not (Test-Path $sebDocuments)) { throw 'Documents\SEB EvalPro doit exister pour les exports Word.' }
          $visible = @(Get-ChildItem -LiteralPath $sebDocuments -Force)
          $bad = @($visible | Where-Object { $_.PSIsContainer -or $_.Extension -notin @('.doc','.docx') })
          if ($bad.Count -gt 0) {
            throw "Contenu technique encore présent dans Documents : $($bad.FullName -join ', ')"
          }
          if (-not (Test-Path (Join-Path $sebDocuments 'Evaluation_CI.docx'))) {
            throw 'Le Word historique n’a pas été conservé dans Documents\SEB EvalPro.'
          }
          Write-Host 'DOCUMENTS_SEB_EVALPRO_WORD_ONLY: OK'

          $storageCandidates = @(
            (Join-Path $env:APPDATA 'SEB-éval-PRO\storage'),
            (Join-Path $env:APPDATA 'seb-evalpro\storage'),
            (Join-Path $env:APPDATA 'SEB EvalPro\storage'),
            (Join-Path $env:APPDATA 'SEB-eval-PRO\storage')
          ) | Select-Object -Unique
          $storage = $storageCandidates | Where-Object { Test-Path (Join-Path $_ 'Candidats\CAND-LEGACY-CI\manifest.json') } | Select-Object -First 1
          if (-not $storage) { throw 'Stockage interne 0.3.8 introuvable après migration.' }

          foreach ($dir in @('Candidats','System','parcours','Admin','Corbeille','Bilans')) {
            if (-not (Test-Path (Join-Path $storage $dir))) { throw "Dossier interne migré absent : $dir" }
          }
          $legacyManifest = Join-Path $storage 'Candidats\CAND-LEGACY-CI\manifest.json'
          if ((Get-Content $legacyManifest -Raw).Trim() -ne 'SEBLOCAL1:OLD-ENCRYPTED-CANDIDATE-CI') {
            throw 'Le candidat chiffré historique a été modifié pendant la migration.'
          }
          $recoveryDir = Join-Path $storage 'System\Recovery'
          if (-not (Test-Path $recoveryDir)) { throw 'La clé ancienne illisible n’a pas été mise en récupération.' }
          if (-not (Get-ChildItem $recoveryDir -Filter 'backup-key-unreadable-*.sebkey' -ErrorAction SilentlyContinue)) {
            throw 'La sauvegarde de clé illisible n’a pas été conservée.'
          }
          Write-Host 'UNREADABLE_LEGACY_KEY_DOES_NOT_BLOCK_APP: OK'
          Write-Host 'LEGACY_ENCRYPTED_CANDIDATE_PRESERVED: OK'

          # Un seul dossier candidat corrompu dans le stockage interne ne doit jamais bloquer l'application.
          $corruptDir = Join-Path $storage 'Candidats\CAND-CORRUPT-CI'
          New-Item -ItemType Directory -Force -Path $corruptDir | Out-Null
          Set-Content -LiteralPath (Join-Path $corruptDir 'manifest.json') -Value 'SEBLOCAL1:CORRUPT-CANDIDATE-ONLY' -Encoding ascii
          Assert-SebWindow 'CORRUPT_CANDIDATE_ISOLATED'
          Write-Host 'ONE_CORRUPT_CANDIDATE_DOES_NOT_BLOCK_APP: OK'

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Désinstallation après test démarrage échouée : $($uninstall.ExitCode)" }
          if (-not (Test-Path $storage)) { throw 'Le stockage interne candidat a été supprimé par la désinstallation.' }
          if (-not (Test-Path (Join-Path $sebDocuments 'Evaluation_CI.docx'))) { throw 'Le Word exporté a été supprimé par la désinstallation.' }
          Write-Host 'INTERNAL_DATA_PRESERVED_AFTER_UNINSTALL: OK'

      - name: Upload Windows 0.3.8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-0.3.8-Windows-Setup
          path: dist/SEB-eval-PRO-0.3.8-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish 0.3.8 test release
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "seb-evalpro-seb-ia-038-build-${{ github.run_number }}"
          $setup = 'dist\SEB-eval-PRO-0.3.8-Windows-Setup.exe'
          $uninstaller = 'dist\SEB-eval-PRO-0.3.8-Windows-Desinstallation.exe'
          $title = "SEB EvalPro 0.3.8 - SEB-IA - Build #${{ github.run_number }}"
          $notes = "Setup complet SEB-éval-PRO 0.3.8 avec stockage candidat interne, Documents réservé aux exports Word, migration sécurisée des anciens dossiers, isolation d'une clé ou d'un candidat illisible, SEB-IA intégrée et désinstallateur autonome."
          gh release create $tag $setup $uninstaller --target "${{ github.sha }}" --title $title --notes $notes --prerelease --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw 'Publication Release test 0.3.8 échouée.' }
          Write-Host "RELEASE_TAG=$tag"
