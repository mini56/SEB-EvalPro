name: TEST Windows SEB-IA Single Setup

on:
  pull_request:
    branches:
      - tmp-split-candidat-admin-ai-pack
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate SEB-IA
        run: npm run test:seb-ia

      - name: Set test version
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = '0.3.0'
          $p | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8

      - name: Generate installer resources
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path build | Out-Null

          function New-Bmp([string]$Path,[int]$Width,[int]$Height) {
            $bmp = New-Object System.Drawing.Bitmap $Width,$Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::White)
            $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(0,112,192))
            $g.FillRectangle($brush,0,0,$Width,[Math]::Max(18,[int]($Height*0.28)))
            $fontSize = [Math]::Max(8,[Math]::Min(22,[int]($Width/10)))
            $font = [System.Drawing.Font]::new('Arial',[single]$fontSize,[System.Drawing.FontStyle]::Bold)
            $g.DrawString('SEB EvalPro',$font,$brush,8,[Math]::Max(22,[int]($Height*0.38)))
            $bmp.Save($Path,[System.Drawing.Imaging.ImageFormat]::Bmp)
            $font.Dispose(); $brush.Dispose(); $g.Dispose(); $bmp.Dispose()
          }

          New-Bmp 'build/installerHeader.bmp' 150 57
          New-Bmp 'build/installerBranding.bmp' 164 314

          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(0,112,192))
          $font = [System.Drawing.Font]::new('Arial',[single]70,[System.Drawing.FontStyle]::Bold)
          $white = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $g.DrawString('SEB',$font,$white,22,72)
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = [System.IO.File]::Open('build/app-icon.ico',[System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Dispose(); $icon.Dispose(); $white.Dispose(); $font.Dispose(); $g.Dispose(); $bmp.Dispose()

      - name: Build single Windows Setup
        run: npm run dist:win

      - name: Verify single Setup
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem dist -Filter '*Windows-Setup.exe' -File)
          if ($setups.Count -ne 1) { throw "Attendu : exactement 1 Setup Windows. Trouvé : $($setups.Count)" }
          if (Select-String -Path build/installer.nsh -Pattern 'Ministral-3-8B-Instruct|SEB-EvalPro-IA-Pack-Setup|vc_redist.x64.exe' -Quiet) {
            throw 'Ancienne dépendance Mistral/Pack IA encore présente dans le Setup.'
          }
          Write-Host "Setup unique : $($setups[0].FullName)"
          Get-FileHash $setups[0].FullName -Algorithm SHA256 | Format-List

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-SEB-IA-V1-Windows-Test
          path: |
            dist/*Windows-Setup.exe
            dist/*Windows-Desinstallation.exe
          if-no-files-found: error
          retention-days: 14
