name: Export Green Generated Reference

on:
  push:
    branches:
      - tmp-cleanup-reference-65f9

jobs:
  export-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate validated web application
        run: npm run prepare:web

      - name: Upload generated reference
        uses: actions/upload-artifact@v4
        with:
          name: green-generated-reference
          if-no-files-found: error
          path: |
            app/web/**
            src/**
