name: TEST 165+ Synthèse bilan

on:
  push:
    branches:
      - test-165plus-synthese-bilan

jobs:
  build-windows-test:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Ensure ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress -y
          }
      - name: Generate installer branding
        shell: pwsh
        run: ./scripts/generate-installer-branding.ps1
      - name: Normalize Windows NSIS encodings
        shell: pwsh
        run: |
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          foreach ($relativePath in @('build\\installer.nsh','build\\standalone-uninstaller.nsi')) {
            $path = (Resolve-Path $relativePath).Path
            $text = [System.IO.File]::ReadAllText($path)
            [System.IO.File]::WriteAllText($path, $text, $utf8Bom)
          }
      - name: Build Windows test installer
        run: |
          npm run prepare:web
          node scripts/build165plus-history-synthesis.js
          node scripts/build165plus-institutional-synthesis-v4.js
          node scripts/build165plus-natural-synthesis-v5-runner.js
          node scripts/build165plus-natural-synthesis-v6.js
          node scripts/build165plus-natural-synthesis-v7.js
          npx electron-builder --win --publish never
      - name: Build standalone Windows uninstaller
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis --no-progress -y
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'NSIS\\makensis.exe'
            if (Test-Path $candidate) { $makensis = Get-Item $candidate }
          }
          if (-not $makensis) { throw 'makensis.exe introuvable.' }
          $makensisPath = if ($makensis.Source) { $makensis.Source } else { $makensis.FullName }
          & $makensisPath "/DAPP_VERSION=$version" 'build\\standalone-uninstaller.nsi'
          if ($LASTEXITCODE -ne 0) { throw "Compilation désinstallateur échouée : $LASTEXITCODE" }
      - name: Publish private 165+ test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "seb-evalpro-165plus-synthese-${{ github.run_number }}"
          $setup = "dist\\SEB-eval-PRO-$version-Windows-Setup.exe"
          $uninstaller = "dist\\SEB-eval-PRO-$version-Windows-Desinstallation.exe"
          $title = "SEB EvalPro 165+ - Test synthèse bilan #${{ github.run_number }}"
          $notes = "Prototype isolé dérivé strictement du Build #165 validé. Dernier test sans IA : synthèse individualisée à partir des niveaux et des observations, commentaires interprétés plutôt que recopiés, conclusion cohérente par compétence, longueur libre, déduplication stricte et bloc Ressenti stagiaire. Fonctionne sur bilan courant et anciens bilans. Ne remplace pas la version de référence."
          gh release create $tag $setup $uninstaller --target "${{ github.sha }}" --title $title --notes $notes --prerelease --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Publication release test échouée : $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SEB-eval-PRO-165plus-Windows
          path: dist/*

  build-linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Linux AppImage test
        run: |
          npm run prepare:web
          node scripts/build165plus-history-synthesis.js
          node scripts/build165plus-institutional-synthesis-v4.js
          node scripts/build165plus-natural-synthesis-v5-runner.js
          node scripts/build165plus-natural-synthesis-v6.js
          node scripts/build165plus-natural-synthesis-v7.js
          npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SEB-eval-PRO-165plus-Linux
          path: dist/*