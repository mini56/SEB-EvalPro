name: Probe Edge Julie voice

on:
  push:
    branches:
      - tmp-julie-edge-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Edge TTS voices
        run: |
          python -m pip install --quiet edge-tts
          edge-tts --list-voices > voices.txt
          echo 'JULIE_MATCHES_BEGIN'
          grep -i 'julie\|fr-FR' voices.txt || true
          echo 'JULIE_MATCHES_END'
          if grep -qi 'julie' voices.txt; then
            echo 'JULIE_FOUND'
          else
            echo 'JULIE_NOT_FOUND'
          fi
