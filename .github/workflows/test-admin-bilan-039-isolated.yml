name: TEST Admin Bilan 0.3.9 Isolated

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-bilan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate clean web application
        run: npm run prepare:web

      - name: Isolated Admin Bilan smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron --no-sandbox scripts/admin-bilan-windows-smoke.js
          if ($LASTEXITCODE -ne 0) { throw 'Smoke Admin Bilan isolé échoué.' }
          Write-Host 'ADMIN_BILAN_ISOLATED_WINDOWS=OK'
