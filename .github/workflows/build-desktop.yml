name: Build SEB EvalPro desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows portable application
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Windows
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Linux AppImage
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: SEB-EvalPro-Linux
          path: dist/*
