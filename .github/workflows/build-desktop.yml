name: Build SEB-éval-PRO desktop

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-foundation

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Ensure ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress -y
          }
      - name: Generate installer branding
        shell: pwsh
        run: ./scripts/generate-installer-branding.ps1
      - name: Build Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: SEB-eval-PRO-Windows
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Linux AppImage
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: SEB-eval-PRO-Linux
          path: dist/*
