name: Build SEB-éval-PRO desktop

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-foundation

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Ensure ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress -y
          }
      - name: Generate installer branding
        shell: pwsh
        run: ./scripts/generate-installer-branding.ps1
      - name: Build Windows installer
        run: npm run dist:win
      - name: Build standalone Windows uninstaller
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            choco install nsis --no-progress -y
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
            if (Test-Path $candidate) {
              $makensis = Get-Item $candidate
            }
          }
          if (-not $makensis) {
            throw 'makensis.exe introuvable après installation de NSIS.'
          }
          $makensisPath = if ($makensis.Source) { $makensis.Source } else { $makensis.FullName }
          & $makensisPath "/DAPP_VERSION=$version" 'build\standalone-uninstaller.nsi'
          if ($LASTEXITCODE -ne 0) {
            throw "Compilation du désinstallateur autonome échouée (code $LASTEXITCODE)."
          }
          $uninstaller = "dist\SEB-eval-PRO-$version-Windows-Desinstallation.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Désinstallateur autonome absent : $uninstaller"
          }
          Write-Host "Désinstallateur autonome généré : $uninstaller"
      - uses: actions/upload-artifact@v4
        with:
          name: SEB-eval-PRO-Windows
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Linux AppImage
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: SEB-eval-PRO-Linux
          path: dist/*
