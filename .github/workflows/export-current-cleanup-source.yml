name: Export Current Cleanup Source

on:
  push:
    branches:
      - tmp-cleanup-current-source

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: current-cleanup-source
          if-no-files-found: error
          path: |
            source/**
            src/**
            scripts/**
            package.json
            .github/workflows/test-seb-ia-v1.yml
