name: DIAG Admin Bilan Load 0.3.9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate clean web application
        run: npm run prepare:web
      - name: Locate Admin Bilan load blocker
        run: npx electron --no-sandbox scripts/admin-bilan-load-diagnostic.js
